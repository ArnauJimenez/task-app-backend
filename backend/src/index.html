<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks</title>
</head>
<body>
    <h1>My Task Manager</h1>
    
    <div id="lista-tareas"></div>

    <script>
        // 1. Simulate a token stored in the browser.
        // Paste the token used for testing here.
        const MI_TOKEN = "PASTE_YOUR_JWT_HERE";

        // 2. Render a task with its delete button.
        function renderizarTarea(id, titulo) {
            const contenedor = document.getElementById("lista-tareas");
            
            // Pass the task ID to the button handler.
            contenedor.innerHTML += `
                <div id="tarea-${id}" style="margin-bottom: 10px;">
                    <span><strong>${titulo}</strong></span>
                    <button onclick="eliminarTareaFromServer('${id}')">🗑️ Delete</button>
                </div>
            `;
        }

        // 3. Delete the task when the button is clicked.
        async function eliminarTareaFromServer(idDeLaTarea) {
            console.log("Sending DELETE request for task:", idDeLaTarea);

            try {
                const response = await fetch(`http://localhost:3000/tasks/${idDeLaTarea}`, {
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${MI_TOKEN}`
                    }
                });

                if (response.ok) {
                    // Remove the task from the page after a successful response.
                    document.getElementById(`tarea-${idDeLaTarea}`).remove();
                    alert("Task deleted successfully!");
                } else {
                    alert("Failed to delete the task from the server");
                }
            } catch (error) {
                console.error("Request error:", error);
            }
        }

        // Manual test: replace this ID with one from your database.
        renderizarTarea("cmpwlegym00019d1i6ode2a2p", "My first test task");
    </script>
</body>
</html>
