services:
  postgres_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to use postgres_db:5432}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PRIMARY_LLM_API_KEY: ${PRIMARY_LLM_API_KEY:-}
      PRIMARY_LLM_BASE_URL: ${PRIMARY_LLM_BASE_URL:-}
      PRIMARY_LLM_MODEL: ${PRIMARY_LLM_MODEL:-}
      SECONDARY_LLM_API_KEY: ${SECONDARY_LLM_API_KEY:-}
      SECONDARY_LLM_BASE_URL: ${SECONDARY_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      SECONDARY_LLM_MODEL: ${SECONDARY_LLM_MODEL:-openai/gpt-oss-120b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      SENTRY_DSN: ${SENTRY_DSN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-${FRONTEND_URL:-http://localhost:5173,http://localhost:8080}}
    depends_on:
      postgres_db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
