# Render Blueprint: native Node runtime, no Dockerfile.
# The backend is a subdirectory of this repository.
services:
  - type: web
    name: task-management-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PRIMARY_LLM_API_KEY
        sync: false
      - key: SECONDARY_LLM_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
